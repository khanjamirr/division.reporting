<script>
'use strict';
const VERSION='v3.6';
const NS_HEADERS=['Client','Location','Pending onboarding','Schedules for today','Interviews today','Total schedules','Total pipeline'];
const WEST_HEADERS=['Client','Location','Pending onboarding','Schedule in branch','Pipeline (Available/OAE)','Pipeline (Unavailable/Inactive)'];
const FLAG_HEADERS=['Recruiter','Candidate','EID','Client','Location','Branch Schedule?','Appointment date','Why'];
function localDay(d){return d instanceof Date&&!isNaN(d)?d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'):'';}
function parseDay(v){
 if(v instanceof Date)return isNaN(v)?'':v.getUTCFullYear()+'-'+String(v.getUTCMonth()+1).padStart(2,'0')+'-'+String(v.getUTCDate()).padStart(2,'0');
 if(typeof v==='number'){const d=new Date(Date.UTC(1899,11,30)+Math.floor(v)*86400000);return d.toISOString().slice(0,10);}
 if(typeof v!=='string'||!v.trim())return '';
 const s=v.trim(),iso=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);if(iso)return s;
 return localDay(new Date(s));
}
function normalizeLocation(v){let s=String(v||'').trim().replace(/\s+/g,' ').replace(/\s*,\s*/g,', ');if(!s.includes(','))s=s.replace(/^(.*\S)\s+([A-Za-z]{2})$/,(_,a,b)=>a+', '+b.toUpperCase());else s=s.replace(/,\s*([A-Za-z]{2})$/,(_,b)=>', '+b.toUpperCase());return s;}
function visibleRecords(data,state){
 const clients=new Set(state.clients),locations=new Set(state.locations),hc=new Set(state.hiddenClients),hl=new Set(state.hiddenLocations),q=state.search.trim().toLowerCase();
 const added=new Set(state.addedPairs||[]),removed=new Set([...(state.removedPairs||[]),...(state.hiddenPairs||[])]);
 return data.filter(r=>!removed.has(JSON.stringify([r.client,r.location]))&&(added.has(JSON.stringify([r.client,r.location]))||(clients.has(r.client)&&locations.has(r.location)&&!hc.has(r.client)&&!hl.has(r.location)&&(!q||(r.client+' '+r.location).toLowerCase().includes(q)))));
}
function groupMap(groups){const map=new Map();groups.forEach(g=>g.members.forEach(m=>map.set(m,g)));return map;}
function groupedReport(records,state){
 const cm=groupMap(state.clientGroups),lm=groupMap(state.locationGroups),buckets=new Map(),rowMap=new Map();
 (state.rowGroups||[]).forEach(g=>g.pairs.forEach(p=>rowMap.set(p,g)));
 const end=new Date(state.weekEnd+'T12:00:00'),start=new Date(end);start.setDate(start.getDate()-6);const from=localDay(start);
 records.forEach(r=>{
  const single=(state.addedPairs||[]).includes(JSON.stringify([r.client,r.location]));
  const rg=rowMap.get(JSON.stringify([r.client,r.location]));
  const c=single?null:cm.get(r.client),l=single?null:lm.get(r.location),key=rg?JSON.stringify(['row',rg.id]):JSON.stringify([c?['g',c.id]:['v',r.client],l?['g',l.id]:['v',r.location]]);
  if(!buckets.has(key))buckets.set(key,{client:rg?rg.clientLabel:(c?c.name:r.client),location:rg?rg.locationLabel:(l?l.name:r.location),counts:Array(state.module==='west'?4:5).fill(0),ids:[],pairs:new Set()});
  const b=buckets.get(key);b.ids.push(r.id);b.pairs.add(JSON.stringify([r.client,r.location]));
  if(state.module==='west'){
   if(!r.dateAdded||r.dateAdded<from||r.dateAdded>state.weekEnd)return;
   if(r.onboardingStage!=='EB Complete/I9 Complete')b.counts[0]++;
   if(r.branchSchedule==='Yes')b.counts[1]++;
   if(['Available','OAE'].includes(r.ebStatusReason))b.counts[2]++;
   if(['Unavailable','Inactive'].includes(r.ebStatusReason))b.counts[3]++;
  }else{
   if(r.onboardingStage!=='EB Complete/I9 Complete')b.counts[0]++;
   if(r.branchSchedule==='Yes'&&r.dateAdded===state.scheduleDate)b.counts[1]++;
   if(r.apptDate&&r.apptDate===state.interviewDate)b.counts[2]++;
   if(r.branchSchedule==='Yes')b.counts[3]++;
   b.counts[4]++;
  }
 });
 const result=Array.from(buckets.values());result.sort((a,b)=>a.location.localeCompare(b.location)||a.client.localeCompare(b.client));
 return {rows:result,totals:result.reduce((t,b)=>t.map((n,i)=>n+b.counts[i]),Array(state.module==='west'?4:5).fill(0))};
}
function redFlags(records,filters){
 const result=records.filter(r=>((r.branchSchedule==='Yes'&&!r.apptDate)||(r.apptDate&&(r.branchSchedule==='No'||!r.branchSchedule)))&&(!filters.recruiter||r.recruiter===filters.recruiter)&&(!filters.from||(r[filters.dateField]&&r[filters.dateField]>=filters.from))&&(!filters.to||(r[filters.dateField]&&r[filters.dateField]<=filters.to)));
 const field=filters.sort==='dateAsc'||filters.sort==='dateDesc'?filters.dateField:filters.sort;

 function paint(){const term=q('.pair-search').value.toLowerCase(),list=q('.pair-list');list.innerHTML='';pairs.filter(([,pair])=>pair.join(' ').toLowerCase().includes(term)).forEach(([key,pair])=>{const label=document.createElement('label');label.className='check-item';const cb=document.createElement('input');cb.type='checkbox';cb.checked=picked.has(key);const span=document.createElement('span');span.textContent=pair.join(' · ');label.append(cb,span);list.append(label);cb.onchange=()=>{cb.checked?picked.add(key):picked.delete(key);q('.apply-add').disabled=!picked.size;q('.apply-add').textContent='Add to report'+(picked.size?' ('+picked.size+')':'')}})}
 q('.pair-search').oninput=paint;q('.cancel-add').onclick=q('.close-add').onclick=()=>dialog.close();dialog.onclose=()=>dialog.remove();q('.apply-add').onclick=()=>{lockReportPairs(Array.from(picked));dialog.close()};paint();dialog.showModal();
}
$('add-report').onclick=addToReport;
$('reset-all').onclick=()=>{const module=state.module;state=fresh();state.module=module;state.clients=[];state.locations=[];updateLists();refresh();status('All filters, groups and hidden items cleared')};


$('show-flags').onclick=()=>{state.flagsEnabled=true;render()};
$('merge-rows').onclick=()=>{
 const selected=Array.from($('report-table').querySelectorAll('[data-select-row]:checked')).map(cb=>report.rows[Number(cb.dataset.selectRow)]);if(selected.length<2)return;
 const pairs=Array.from(new Set(selected.flatMap(r=>Array.from(r.pairs))));
 const dialog=document.createElement('dialog');dialog.innerHTML='<div class="dialog-head"><h2>Merge selected rows</h2></div><label class="field">Client label<input id="row-client-name"></label><label class="field">Location label<input id="row-location-name"></label><div class="dialog-footer"><button class="cancel-row-merge">Cancel</button><button class="primary apply-row-merge">Merge rows</button></div>';document.body.append(dialog);
 dialog.querySelector('#row-client-name').value=Array.from(new Set(selected.map(r=>r.client))).join(' / ');dialog.querySelector('#row-location-name').value=Array.from(new Set(selected.map(r=>r.location))).join(' / ');
 dialog.querySelector('.cancel-row-merge').onclick=()=>dialog.close();dialog.onclose=()=>dialog.remove();dialog.querySelector('.apply-row-merge').onclick=()=>{
 const picked=new Set(pairs);state.rowGroups=state.rowGroups.filter(g=>!g.pairs.some(p=>picked.has(p)));state.rowGroups.push({id:'rows'+Date.now(),pairs,clientLabel:dialog.querySelector('#row-client-name').value.trim()||'Merged clients',locationLabel:dialog.querySelector('#row-location-name').value.trim()||'Merged locations'});lockReportPairs(pairs);dialog.close();status('Selected rows merged');
 };dialog.showModal();
};

$('upload').onclick=()=>$('file').click();$('file').onchange=e=>loadFile(e.target.files[0]);
['dragover','drop'].forEach(event=>document.addEventListener(event,e=>{if(Array.from(e.dataTransfer.types).includes('Files')){e.preventDefault();if(event==='drop')loadFile(e.dataTransfer.files[0])}}));
$('remove').onclick=()=>{data=[];fileName='';state=fresh();state.module='source';try{localStorage.removeItem(DATA_KEY);localStorage.removeItem(STATE_KEY);localStorage.removeItem('divisionReportingDashboard.dataset.v1')}catch(e){}status('');updateLists();refresh()};
['ns','west','flags','source'].forEach(m=>$('module-'+m).onclick=()=>{state.module=m;render()});
$('search').oninput=e=>{state.search=e.target.value;render()};$('reset-filters').onclick=()=>{state.clients=[];state.locations=[];state.search='';$('search').value='';refresh()};
$('merge').onclick=()=>editDimension('merge');$('hide').onclick=()=>editDimension('hide');
for(const [id,key] of [['schedule-date','scheduleDate'],['interview-date','interviewDate'],['week-end','weekEnd']])$(id).onchange=e=>{if(!e.target.value){e.target.value=state[key];return}state[key]=e.target.value;render()};
for(const [id,key] of [['recruiter','recruiter'],['flag-date-field','dateField'],['flag-from','from'],['flag-to','to'],['flag-sort','sort']])$(id).onchange=e=>{state.flags[key]=e.target.value;if(key==='sort')delete state.flags.headerKey;render()};
$('reset-flags').onclick=()=>{state.flags=fresh().flags;syncControls();render()};$('export-target').onchange=render;
$('download').onclick=()=>{
 if(typeof XLSX==='undefined'){status('Excel library unavailable. Connect to the internet and reload.',true);return}
 const isFlags=$('export-target').value==='flags',values=isFlags?flagMatrix():reportMatrix(),book=XLSX.utils.book_new(),sheet=XLSX.utils.aoa_to_sheet(values);sheet['!cols']=values[0].map((_,i)=>({wch:i<2?30:22}));XLSX.utils.book_append_sheet(book,sheet,isFlags?'Red flags':state.module==='west'?'West Weekly':'Division Reporting');XLSX.writeFile(book,(isFlags?'red-flags':state.module==='west'?'west-weekly':'division-reporting')+'-'+VERSION+'-'+localDay(new Date())+'.xlsx');status('Excel downloaded');
};
$('copy').onclick=async()=>{
 const text=toTSV($('export-target').value==='flags'?flagMatrix():reportMatrix());
 try{if(!navigator.clipboard)throw new Error();await navigator.clipboard.writeText(text);status('Copied')}
 catch(e){const dialog=document.createElement('dialog');dialog.innerHTML='<div class="dialog-head"><h2>Copy data</h2><button aria-label="Close">×</button></div><textarea aria-label="Data to copy" style="width:100%;height:230px"></textarea>';document.body.append(dialog);dialog.querySelector('textarea').value=text;dialog.querySelector('button').onclick=()=>dialog.close();dialog.onclose=()=>dialog.remove();dialog.showModal();dialog.querySelector('textarea').select();status('Clipboard unavailable. Press Ctrl+C / Cmd+C.');}
};
$('mobile-toggle').onclick=()=>{$('sidebar').classList.toggle('open');$('mobile-toggle').setAttribute('aria-expanded',$('sidebar').classList.contains('open'))};
function restore(){
 try{const raw=localStorage.getItem(DATA_KEY);let stored=raw?JSON.parse(raw):null;
 if(!stored){const old=localStorage.getItem('divisionReportingDashboard.dataset.v1');if(old){const p=JSON.parse(old);stored={fileName:p.fileName,rows:p.rows.map((r,i)=>({...r,id:i,client:r.client||'(No client)',location:r.location||'(No location)',dateAdded:parseDay(r.dateAdded),apptDate:parseDay(r.apptDate)}))}}}
 if(!stored||!Array.isArray(stored.rows)||!stored.rows.length)return;
 data=stored.rows.map((r,i)=>({...r,id:i}));fileName=stored.fileName||'Saved file';state=fresh();

 }catch(e){data=[];fileName='';state=fresh();status('Saved data could not be restored.',true)}
}
restore();updateLists();paintSaved();render();
})();

</script></body></html>
